name: Goldenkeys scheduled import

# Fortnightly re-scrape of Goldenkeys hospitality vacancies: imports new roles,
# updates existing in place, and reconciles gone roles to `filled`. Keeps the
# public job board AND the /feed/jobs.xml aggregator feed fresh with no manual run.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   FIRECRAWL_API_KEY, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   SITE_URL, CRON_SECRET  <- needed so newly-imported roles get their area
#                             resolved; without them the run still works but
#                             warns, and new roles match every candidate's area.

on:
  schedule:
    # Tuesdays 06:00 UTC — deliberately two hours before the weekly candidate
    # roundup email (vercel.json: /api/cron/roles-roundup, '0 8 * * 2').
    #
    # Weekly rather than twice-weekly on Firecrawl cost: a full run is ~250
    # scrapes, so halving the frequency halves the spend. The ordering is what
    # makes weekly acceptable — collecting immediately before the email means
    # candidates get roles off a board that is hours old, not six days old. If
    # the scrape day ever moves, move it with the email, not independently.
    - cron: '0 6 * * 2'
  workflow_dispatch: {}    # manual "Run workflow" button in the Actions tab

concurrency:
  group: goldenkeys-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not `npm ci`) — tolerant of the lockfile drift that only
      # strict `npm ci` rejects across npm major versions; matches how Vercel
      # builds this repo. A scraper cron doesn't need ci's exact pinning.
      - run: npm install --no-audit --no-fund
      - name: Run Goldenkeys importer (--all --no-update-existing)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # --no-update-existing: import new roles and retire dead ones, but do
        # not rewrite an advert we already hold. Measured 10 Sept 2026 — the
        # update path would have changed a field on 84 of 92 live adverts and a
        # FACT on none of them, collapsing bullet lists into paragraphs on 18.
        # A real employer edit to an existing advert is now missed until the
        # fact-comparison version lands; see the flag's own comment.
        run: node scripts/import-goldenkeys.mjs --all --no-update-existing
