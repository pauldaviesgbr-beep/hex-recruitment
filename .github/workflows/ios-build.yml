# THE iOS BUILD PIPELINE — GITHUB ACTIONS ON HOSTED macOS.
#
# WHY ACTIONS AND NOT XCODE CLOUD. Decided 28 Aug 2026. Xcode Cloud needs a
# Mac ONCE, in Xcode, to create the first workflow and grant GitHub access —
# which reintroduces the exact dependency the choice exists to remove. And
# first pipelines fail several times, so with Xcode Cloud the failures arrive
# after the borrowed Mac has gone home. Actions removes the Mac permanently.
#
# MANUAL DISPATCH ONLY. This used to say macOS minutes bill at 10x against a
# ~200-minute allowance. THAT WAS WRONG — private-repo economics applied to a
# public repo — and the invoice settled it: 28 Aug 2026, macOS 3-core, 2 min,
# gross $0.12, BILLED $0. Standard runners are free here, and the 3-core
# standard image is why; a -large runner would be charged.
#
# So dispatch-only is now a CONVENIENCE, not a cost control: it exists so a
# build happens when someone means it to, not on every commit. Iteration is
# free. If the repository ever goes private, the same build costs ~$0.12.
#
# THREE JOBS, AND THE SPLIT IS THE POINT.
#   compile  NO SECRETS AT ALL — proves the pipeline before anyone touches an
#            Apple account.
#   archive  the signed build. A green compile with a failed archive still
#            says everything except signing works.
#   upload   TestFlight, and it does NOT run unless you type `yes`. Shipping a
#            build to real testers is not something a pipeline should do by
#            default.

name: iOS build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner image (pinned; macos-latest deliberately not used)'
        required: false
        default: 'macos-15'
      xcode:
        # 'newest26' picks the highest Xcode 26 or later on the runner. Apple
        # REFUSES any upload built with an older SDK - that is what killed
        # run #4, which took the image default and got Xcode 16.4 / iOS 18.5.
        # Name a version (e.g. 26.3) to pin one; 'image-default' opts out and
        # exists only so the old behaviour stays reachable deliberately.
        description: 'newest26 (default), a version like 26.3, or image-default'
        required: false
        default: 'newest26'
      upload:
        description: 'Upload the signed .ipa to TestFlight? Type yes to send it.'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']

# Nothing here writes to the repository or the deployment.
permissions:
  contents: read

concurrency:
  # A second dispatch cancels the first rather than burning macOS minutes twice.
  group: ios-build
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (unsigned — no secrets needed)
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # MEASURE THE RUNNER, DO NOT ASSUME IT. The image label is pinned, but
      # what that label actually carries changes over time. Printing it means a
      # future failure can be compared against a run that worked, instead of
      # being guessed at.
      - name: What this machine actually is
        run: |
          sw_vers
          echo "--- available Xcodes ---"
          ls /Applications | grep -i '^Xcode' || true
          echo "--- selected Xcode ---"
          xcodebuild -version

      # THE SDK IS WHAT APPLE CHECKS, NOT THE XCODE NAME, so this asserts the
      # SDK. Run #4 archived happily under Xcode 16.4 and Apple refused it for
      # the iOS 18.5 SDK - and the archive job did not select an Xcode AT ALL,
      # so the input above could not have saved it however it was set. Both
      # jobs run this step now, which is the half that actually mattered.
      - name: Select Xcode, and prove the SDK is one Apple will accept
        run: |
          set -e
          WANT='${{ inputs.xcode }}'
          if [ "$WANT" = "newest26" ] || [ -z "$WANT" ] || [ "$WANT" = "default" ]; then
            PICK=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
                   | sed 's|.*/Xcode_||; s|\.app$||' \
                   | awk -F. '$1 >= 26' | sort -V | tail -1)
            if [ -z "$PICK" ]; then
              echo "NO XCODE 26 OR LATER ON THIS RUNNER - Apple will refuse whatever this builds."
              ls -d /Applications/Xcode_*.app || true
              exit 1
            fi
            echo "picked the newest Xcode 26 or later: $PICK"
          elif [ "$WANT" = "image-default" ]; then
            PICK=""
            echo "taking the image default DELIBERATELY - the SDK check below still runs"
          else
            PICK="$WANT"
            echo "pinned by the dispatch input: $PICK"
          fi

          if [ -n "$PICK" ]; then
            test -d "/Applications/Xcode_${PICK}.app" \
              || { echo "Xcode_${PICK}.app IS NOT ON THIS RUNNER"; ls -d /Applications/Xcode_*.app; exit 1; }
            sudo xcode-select -s "/Applications/Xcode_${PICK}.app"
          fi
          xcodebuild -version

          # The assertion. An Xcode name is a proxy; this is the number Apple
          # reads off the binary, and it is the one that failed.
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          case "$SDK" in
            ''|*[!0-9.]*) echo "COULD NOT READ AN SDK VERSION: '$SDK'"; exit 1 ;;
          esac
          MAJOR=${SDK%%.*}
          test "$MAJOR" -ge 26 \
            || { echo "APPLE REFUSES AN UPLOAD BUILT WITH THE iOS $SDK SDK. It requires 26 or later. This is the error run #4 died on."; exit 1; }
          echo "the iOS $SDK SDK satisfies Apple's minimum of 26"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Caching keyed on the lockfile. Every saved minute is billed at 10x.
          cache: 'npm'

      # THE SAME SCRIPT XCODE CLOUD WOULD RUN, CALLED RATHER THAN COPIED.
      #
      # ios/App/ci_scripts/ci_post_clone.sh is Xcode Cloud's convention and
      # Actions will never run it on its own. Its assertions are the valuable
      # part — that `cap copy` actually put capacitor.config.json and
      # App/public on disk, and that the config names the right site — and two
      # copies of those would agree today and drift later. It resolves paths
      # from its own location, so it works from here as well as from Xcode
      # Cloud's working directory.
      #
      # It runs `npm ci` itself, so there is no separate install step.
      - name: npm ci + cap copy + assert the generated files exist
        run: |
          chmod +x ios/App/ci_scripts/ci_post_clone.sh
          ios/App/ci_scripts/ci_post_clone.sh

      # THE FIRST GOAL: ONE BUILD THAT COMPLETES. Unsigned, because signing is
      # the part that needs Paul's account and this proves everything else in
      # isolation. CODE_SIGNING_ALLOWED=NO is what makes that possible on a
      # runner with no keychain.
      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Prove something was actually produced
        run: |
          # xcodebuild exiting 0 is not the same as an app existing. This is
          # the same rule as everything in scripts/: assert the artefact, do
          # not read the tool's own summary.
          APP=$(find build -name 'App.app' -maxdepth 6 | head -1)
          test -n "$APP" || { echo "NO App.app WAS PRODUCED"; exit 1; }
          echo "built: $APP"
          # And the generated config must be INSIDE the bundle, not merely on
          # disk — that is the failure this whole ci_post_clone dance exists to
          # prevent, and only the bundle can confirm it.
          test -f "$APP/capacitor.config.json" \
            || { echo "capacitor.config.json IS NOT IN THE BUNDLE"; exit 1; }
          test -f "$APP/public/index.html" \
            || { echo "the offline page IS NOT IN THE BUNDLE"; exit 1; }
          echo "the bundle carries its config and its web assets"

  archive:
    name: Signed archive
    needs: compile
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60

    # NO LONGER `if: false`. It was skipped on purpose while the six secrets
    # did not exist, because a job that is red for a reason nobody can fix is
    # a red people learn to ignore. They exist now, so it runs.
    #
    # THREE OF THE SIX ARE NOT USED HERE. ASC_KEY_ID, ASC_ISSUER_ID and
    # ASC_API_KEY are for UPLOADING to App Store Connect, which this
    # deliberately does not do. Signing is manual provisioning with the
    # certificate and the profile, so nothing here needs an API key. They are
    # waiting for the upload step, which is a separate decision.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # THE SDK IS WHAT APPLE CHECKS, NOT THE XCODE NAME, so this asserts the
      # SDK. Run #4 archived happily under Xcode 16.4 and Apple refused it for
      # the iOS 18.5 SDK - and the archive job did not select an Xcode AT ALL,
      # so the input above could not have saved it however it was set. Both
      # jobs run this step now, which is the half that actually mattered.
      - name: Select Xcode, and prove the SDK is one Apple will accept
        run: |
          set -e
          WANT='${{ inputs.xcode }}'
          if [ "$WANT" = "newest26" ] || [ -z "$WANT" ] || [ "$WANT" = "default" ]; then
            PICK=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
                   | sed 's|.*/Xcode_||; s|\.app$||' \
                   | awk -F. '$1 >= 26' | sort -V | tail -1)
            if [ -z "$PICK" ]; then
              echo "NO XCODE 26 OR LATER ON THIS RUNNER - Apple will refuse whatever this builds."
              ls -d /Applications/Xcode_*.app || true
              exit 1
            fi
            echo "picked the newest Xcode 26 or later: $PICK"
          elif [ "$WANT" = "image-default" ]; then
            PICK=""
            echo "taking the image default DELIBERATELY - the SDK check below still runs"
          else
            PICK="$WANT"
            echo "pinned by the dispatch input: $PICK"
          fi

          if [ -n "$PICK" ]; then
            test -d "/Applications/Xcode_${PICK}.app" \
              || { echo "Xcode_${PICK}.app IS NOT ON THIS RUNNER"; ls -d /Applications/Xcode_*.app; exit 1; }
            sudo xcode-select -s "/Applications/Xcode_${PICK}.app"
          fi
          xcodebuild -version

          # The assertion. An Xcode name is a proxy; this is the number Apple
          # reads off the binary, and it is the one that failed.
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          case "$SDK" in
            ''|*[!0-9.]*) echo "COULD NOT READ AN SDK VERSION: '$SDK'"; exit 1 ;;
          esac
          MAJOR=${SDK%%.*}
          test "$MAJOR" -ge 26 \
            || { echo "APPLE REFUSES AN UPLOAD BUILT WITH THE iOS $SDK SDK. It requires 26 or later. This is the error run #4 died on."; exit 1; }
          echo "the iOS $SDK SDK satisfies Apple's minimum of 26"
      # THIS IS A DIFFERENT RUNNER FROM `compile`, WITH A CLEAN CLONE, so it
      # must generate capacitor.config.json and App/public for itself.
      # Skipping it here would sign a binary with no config and no web assets
      # — a green pipeline producing a broken app, which is worse than a red
      # one.
      - name: npm ci + cap copy + assert the generated files exist
        run: |
          chmod +x ios/App/ci_scripts/ci_post_clone.sh
          ios/App/ci_scripts/ci_post_clone.sh

      # ── SIGNING MATERIAL ─────────────────────────────────────────────────
      # No secret is ever echoed. This is a PUBLIC repository and its build
      # logs are world-readable, so a password reaching one would be worse
      # than a failed build.
      - name: Import the distribution certificate into a temporary keychain
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -e
          if [ -z "$P12" ]; then echo "SECRET MISSING OR EMPTY: IOS_DIST_P12"; exit 1; fi
          if [ -z "$P12_PASSWORD" ]; then echo "SECRET MISSING OR EMPTY: IOS_DIST_P12_PASSWORD"; exit 1; fi

          echo "$P12" | base64 --decode > /tmp/dist.p12
          # base64 --decode is quiet about truncated input, so check the shape
          # rather than trusting its exit code.
          if [ ! -s /tmp/dist.p12 ]; then
            echo "IOS_DIST_P12 DECODED TO AN EMPTY FILE - truncated, or not base64"
            exit 1
          fi
          echo "decoded .p12: $(wc -c < /tmp/dist.p12) bytes"

          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          if ! security import /tmp/dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>/tmp/import.err; then
            echo "THE .p12 WOULD NOT IMPORT."
            echo "THE FAULT IS IN A SECRET, NOT THE WORKFLOW: IOS_DIST_P12 or IOS_DIST_P12_PASSWORD."
            cat /tmp/import.err || true
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain > /dev/null

          # A KEYCHAIN THAT UNLOCKS BUT HOLDS NO IDENTITY IS THE CLASSIC SILENT
          # FAILURE HERE. Without this the build dies much later with something
          # misleading about code signing, a long way from the real cause.
          COUNT=$(security find-identity -v -p codesigning build.keychain | grep -c "Apple Distribution" || true)
          echo "Apple Distribution identities in the keychain: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "THE .p12 IMPORTED BUT THE KEYCHAIN HOLDS NO Apple Distribution IDENTITY."
            echo "Most likely the .p12 carries a certificate with no private key."
            security find-identity -v -p codesigning build.keychain || true
            exit 1
          fi
          rm -f /tmp/dist.p12

      - name: Install the provisioning profile, and read what it claims
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e
          if [ -z "$PROFILE" ]; then echo "SECRET MISSING OR EMPTY: IOS_PROVISIONING_PROFILE"; exit 1; fi
          echo "$PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          if [ ! -s /tmp/profile.mobileprovision ]; then
            echo "IOS_PROVISIONING_PROFILE DECODED TO AN EMPTY FILE - truncated, or not base64"
            exit 1
          fi

          # The profile is CMS-signed; this unwraps it into a plain plist.
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          EXPIRY=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" /tmp/profile.plist)

          echo "profile name        : $NAME"
          echo "profile UUID        : $UUID"
          echo "application-id      : $APPID"
          echo "team                : $TEAM"
          echo "profile expires     : $EXPIRY"

          # THE THREE MUST AGREE, AND THIS SAYS WHICH PAIR DOES NOT rather
          # than failing later with a generic signing error. The bundle id is
          # the same one lib/appleSignIn.ts records and iosshell:prove already
          # watches in three places; this is the fourth party to that
          # agreement, and it comes from Apple's own record.
          WANT_BUNDLE=uk.co.thrivecareer.app
          WANT_TEAM=7RTA2FH8C7
          if [ "$APPID" != "$WANT_TEAM.$WANT_BUNDLE" ]; then
            echo "MISMATCH - the profile is for $APPID, this app is $WANT_TEAM.$WANT_BUNDLE"
            exit 1
          fi
          if [ "$TEAM" != "$WANT_TEAM" ]; then
            echo "MISMATCH - profile team $TEAM, expected $WANT_TEAM"
            exit 1
          fi
          echo "profile, team and bundle id all agree"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      # ── ARCHIVE ──────────────────────────────────────────────────────────
      # ── THE BUILD NUMBER, AND WHY IT IS NOT 1 ────────────────────────────
      #
      # project.pbxproj hardcodes CURRENT_PROJECT_VERSION = 1 and
      # MARKETING_VERSION = 1.0. That is fine exactly once. App Store Connect
      # REFUSES a build whose version and build number it has already seen, so
      # the FIRST upload would succeed and the SECOND would be rejected with a
      # message about the bundle version — long after the interesting work,
      # and for a reason that has nothing to do with the change being tested.
      #
      # github.run_number is monotonic per workflow and never repeats, so it
      # is both a valid build number and a traceable one: a tester reporting a
      # bug against build 7 names exactly one Actions run.
      #
      # IT LEAVES GAPS, DELIBERATELY. A dispatch that does not upload still
      # consumes a number. That is the correct trade — a build number that
      # maps to one run is worth more than a contiguous sequence.
      #
      # THE ONE WAY IT COULD COLLIDE: if this workflow is ever deleted and
      # recreated, run_number restarts at 1. Renaming the file is enough to do
      # that. If that happens, bump MARKETING_VERSION rather than trying to
      # force the counter.
      - name: Archive
        run: |
          set -o pipefail
          echo "marketing version : 1.0 (from project.pbxproj)"
          echo "build number      : $GITHUB_RUN_NUMBER (from the Actions run)"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=7RTA2FH8C7 \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export the .ipa
        run: |
          set -o pipefail
          # method: app-store-connect is the Xcode 15+ name. If this runner's
          # Xcode rejects it the error names the accepted values, and the
          # older spelling is app-store.
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo '  <key>teamID</key><string>7RTA2FH8C7</string>'
            echo '  <key>signingStyle</key><string>manual</string>'
            echo '  <key>uploadSymbols</key><true/>'
            echo '  <key>provisioningProfiles</key>'
            echo '  <dict>'
            echo "    <key>uk.co.thrivecareer.app</key><string>$PROFILE_NAME</string>"
            echo '  </dict>'
            echo '</dict>'
            echo '</plist>'
          } > "$RUNNER_TEMP/ExportOptions.plist"
          cat "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # ── ASSERT THE SIGNED PRODUCT, NOT xcodebuild's SUMMARY ─────────────
      # KEEPING THE ARTEFACT COMES BEFORE PROVING IT, AND THAT IS DELIBERATE.
      #
      # Steps run in order and a failed step skips the rest — observed on run
      # 33242786326, where step 10 failed and step 11, this one, was SKIPPED.
      # It carries no `if:`, so it had no way to survive. A full archive and a
      # valid 771,295-byte .ipa were destroyed by an assertion that was itself
      # wrong.
      #
      # KEEPING IS NOT SHIPPING. The upload to App Store Connect is a separate
      # JOB that `needs: archive`, so a red here still fails the job and still
      # stops anything reaching Apple. Nothing is weakened by this order — the
      # binary simply survives its own post-mortem, which is what lets anyone
      # check a claim about the built product against the built product.
      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Thrive-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      # NOT UPLOADED TO APP STORE CONNECT, NOT SENT TO TESTFLIGHT, NOT
      # SUBMITTED. A signed .ipa existing is the goal of this step; what
      # happens to it is Paul's decision and a separate conversation.

      - name: Prove the signed artefact is what it should be
        run: |
          set -e
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "NO .ipa WAS PRODUCED"; exit 1; }
          echo "ipa: $IPA ($(wc -c < "$IPA") bytes)"

          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP" || { echo "NO App.app IN THE ARCHIVE"; exit 1; }

          # THE SAME ASSERTION AS THE UNSIGNED BUILD, ON THE SIGNED PRODUCT.
          # A signed binary with no config and no web assets launches to
          # nothing, and neither xcodebuild nor the store would say so.
          test -f "$APP/capacitor.config.json" || { echo "capacitor.config.json IS NOT IN THE SIGNED BUNDLE"; exit 1; }
          test -f "$APP/public/index.html" || { echo "THE OFFLINE PAGE IS NOT IN THE SIGNED BUNDLE"; exit 1; }
          echo "the signed bundle carries its config and its web assets"

          # IT SURVIVED INTO THE BINARY, not merely into the source file. That
          # is what stops the export-compliance question on every upload.
          # The build number must have reached the BINARY, not just the
          # xcodebuild command line — that is the difference between setting
          # it and shipping it, and a collision is discovered by Apple rather
          # than by us.
          BUILDNO=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" 2>/dev/null || echo MISSING)
          SHORTVER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null || echo MISSING)
          echo "version in the BUILT Info.plist: $SHORTVER ($BUILDNO)"
          test "$BUILDNO" = "$GITHUB_RUN_NUMBER" \
            || { echo "THE BUILD NUMBER DID NOT REACH THE BINARY: wanted $GITHUB_RUN_NUMBER, got $BUILDNO"; exit 1; }

          ENC=$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Info.plist" 2>/dev/null || echo MISSING)
          echo "ITSAppUsesNonExemptEncryption in the BUILT Info.plist: $ENC"
          test "$ENC" = "false" || { echo "IT DID NOT SURVIVE INTO THE BINARY"; exit 1; }

          # And the custom scheme, without which the OAuth sheet returns
          # nowhere and the failure is the silent one.
          SCHEME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist" 2>/dev/null || echo MISSING)
          echo "CFBundleURLSchemes[0] in the BUILT Info.plist: $SCHEME"
          test "$SCHEME" = "uk.co.thrivecareer.app" || { echo "THE OAUTH RETURN SCHEME IS NOT IN THE BINARY"; exit 1; }
          # THE ICON. APPLE CHECKED THIS AND I DID NOT, which is the whole
          # lesson of run #4: every assertion above passed, the archive
          # succeeded, and the .ipa contained no Assets.car at all because
          # actool only WARNS about an image its Contents.json names but
          # cannot find. Four of Apple's five errors were this.
          #
          # scripts/prove-ios-assets.mjs stops it before the push; these two
          # stop it before the upload, and they read the BUILT product rather
          # than the repository, so they also catch a catalogue that was
          # present and still failed to compile.
          test -f "$APP/Assets.car" \
            || { echo "NO Assets.car IN THE BUNDLE - the asset catalogue did not compile, so the app has no icon and Apple will refuse the upload"; exit 1; }
          echo "Assets.car is in the bundle ($(wc -c < "$APP/Assets.car") bytes)"

          ICONNAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist" 2>/dev/null || echo MISSING)
          echo "CFBundleIconName in the BUILT Info.plist: $ICONNAME"
          test "$ICONNAME" = "AppIcon" \
            || { echo "CFBundleIconName IS '$ICONNAME' - actool did not write it, which means no app icon reached the binary"; exit 1; }


          # ── THE PLUGIN IN THE ARTEFACT, NOT IN THE MANIFEST ───────────────
          #
          # prove-capacitor-plugins.mjs runs before the compiler and asserts an
          # INPUT: that the generated Package.swift names every plugin. This
          # asserts the OUTCOME: that the plugin's code is in what we ship.
          #
          # WHAT RUN 33242786326 TAUGHT, so nobody re-derives it. That build was
          # CORRECT and this step failed it. Two facts, both observed:
          #
          #   LOCAL SPM PLUGIN PACKAGES LINK STATICALLY INTO THE APP BINARY on
          #   this pipeline. The Frameworks directory held Capacitor.framework
          #   and Cordova.framework and nothing else — those come from
          #   capacitor-swift-pm, which is dynamic. So ABSENCE FROM Frameworks
          #   IS EXPECTED AND IS EVIDENCE OF NOTHING.
          #
          #   THE SPM MODULE NAME DOES NOT SURVIVE A RELEASE ARCHIVE. The binary
          #   carried CAPBrowserPlugin and did NOT carry CapacitorBrowser. The
          #   module name lives in mangled Swift symbols, which get stripped;
          #   the identifier is a STRING LITERAL that Capacitor resolves through
          #   the Objective-C runtime, so it has to be there for the plugin to
          #   work at all.
          #
          # So the assertion is the runtime identifier ONLY, and the identifiers
          # are read from each plugin's own source rather than written here —
          # Browser is @objc(CAPBrowserPlugin) and App is @objc(AppPlugin), with
          # no shared prefix, so a pattern would have been wrong.
          echo "--- frameworks actually in the built bundle ---"
          echo "    (local SPM plugins link statically, so plugins are NOT expected here)"
          ls "$APP/Frameworks" 2>/dev/null || echo "(no Frameworks directory)"

          IDENTIFIERS=$(node scripts/prove-capacitor-plugins.mjs --print-identifiers) \
            || { echo "COULD NOT READ THE PLUGIN IDENTIFIERS FROM SOURCE"; exit 1; }
          echo "--- runtime identifiers expected, read from the plugins' own sources ---"
          echo "    $IDENTIFIERS"

          PLUGIN_SEARCH="$APP/App"
          [ -d "$APP/Frameworks" ] && PLUGIN_SEARCH="$PLUGIN_SEARCH $APP/Frameworks"
          for ID in $IDENTIFIERS; do
            if grep -rq "$ID" $PLUGIN_SEARCH 2>/dev/null; then
              echo "the compiled binary carries the identifier $ID"
            else
              # SAY ONLY WHAT WAS TESTED. The previous wording claimed the
              # plugin had not reached the binary, printed one line under
              # evidence that another one had. This states the search and its
              # result, and leaves the conclusion to whoever reads it.
              echo "NOT FOUND: the string $ID does not appear in $PLUGIN_SEARCH."
              echo "Capacitor resolves plugins by that identifier through the Objective-C runtime, so a plugin whose identifier is genuinely absent cannot be found at runtime."
              exit 1
            fi
          done

          # And it really is signed, by us.
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier" || true
          codesign --verify --strict --verbose=2 "$APP" && echo "the signature verifies"

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f /tmp/profile.mobileprovision /tmp/profile.plist /tmp/dist.p12 /tmp/import.err || true

  upload:
    name: Upload to TestFlight
    needs: archive
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 45

    # IT DOES NOT FIRE ON EVERY DISPATCH, AND THAT IS THE POINT.
    # A pipeline that ships a new TestFlight version every time somebody
    # presses the button is the wrong default: Apple's processing queue is not
    # a place to send noise, testers get pinged for builds nobody meant to
    # send, and build numbers burn. You have to type `yes`.
    if: ${{ inputs.upload == 'yes' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Thrive-ipa
          path: ipa

      # ── APPLE'S OWN TOOL, NOT A THIRD-PARTY ACTION ───────────────────────
      # `xcrun altool` ships with Xcode. Using it keeps a build that signs our
      # binary free of any new supply-chain dependency — a third-party action
      # here would run arbitrary code in a job that holds a signing identity
      # and an App Store Connect key.
      #
      # notarytool is NOT the tool for this. It notarises Mac software; App
      # Store Connect uploads are altool's job.
      - name: Place the App Store Connect API key where altool looks for it
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          set -e
          if [ -z "$ASC_KEY_ID" ]; then echo "SECRET MISSING OR EMPTY: ASC_KEY_ID"; exit 1; fi
          if [ -z "$ASC_ISSUER_ID" ]; then echo "SECRET MISSING OR EMPTY: ASC_ISSUER_ID"; exit 1; fi
          if [ -z "$ASC_API_KEY" ]; then echo "SECRET MISSING OR EMPTY: ASC_API_KEY"; exit 1; fi

          # altool reads AuthKey_<KEYID>.p8 from a fixed location. The key is
          # written OUTSIDE the workspace so it can never be picked up by an
          # artifact upload, and removed in an always() step below.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          KEYFILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ ! -s "$KEYFILE" ]; then
            echo "ASC_API_KEY DECODED TO AN EMPTY FILE - truncated, or not base64"
            exit 1
          fi
          # Shape only. Never the contents. A .p8 is a PEM private key; if the
          # header is missing the secret is not what we think it is, and that
          # is worth knowing HERE rather than as an opaque auth failure later.
          if ! head -1 "$KEYFILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "ASC_API_KEY IS NOT A PEM PRIVATE KEY."
            echo "THE FAULT IS IN A SECRET, NOT THE WORKFLOW: ASC_API_KEY."
            echo "It should be the base64 of the AuthKey_*.p8 file Apple gave you,"
            echo "and it must NOT be the Sign in with Apple key Z9HFBUW93X."
            exit 1
          fi
          echo "API key in place, $(wc -c < "$KEYFILE") bytes, PEM header present"

      # altool SHIPS INSIDE Xcode.app, not as a separate package, and the
      # runner-image manifest does not list it. "It should be there" is what
      # this week has been about, so it is checked before it is relied on —
      # a missing tool then says so plainly instead of surfacing as a
      # confusing xcrun error in the middle of an upload.
      - name: Confirm altool is actually on this runner
        run: |
          xcodebuild -version
          if ! xcrun --find altool > /dev/null 2>&1; then
            echo "altool IS NOT ON THIS RUNNER."
            echo "It ships inside Xcode; check the selected Xcode above."
            echo "The fallback is iTMSTransporter, or the upload moves to a"
            echo "machine that has it."
            exit 1
          fi
          echo "altool: $(xcrun --find altool)"

      - name: Find the .ipa
        run: |
          set -e
          IPA=$(find ipa -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "NO .ipa CAME BACK FROM THE ARCHIVE JOB"; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "uploading: $IPA ($(wc -c < "$IPA") bytes)"

      # ── VALIDATE FIRST, SEPARATELY FROM UPLOADING ────────────────────────
      # Validation is where Apple names real problems — missing icons, an
      # unsupported architecture, a bad Info.plist key. Running it as its own
      # step means those are reported against a step called "validate" rather
      # than buried in an upload that also failed.
      - name: Validate the binary with Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --validate-app \
            -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json 2>&1 | tee "$RUNNER_TEMP/validate.json"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json 2>&1 | tee "$RUNNER_TEMP/upload.json"

      # ── ASSERT THE OUTCOME, NOT THE EXIT CODE ────────────────────────────
      # altool has historically exited 0 while reporting problems in its
      # output, which is the same family as reading your own echo instead of
      # a status. So the JSON is read for what it actually says.
      - name: Prove Apple accepted it
        run: |
          set -e
          echo "--- what Apple returned ---"
          cat "$RUNNER_TEMP/upload.json"
          echo ""

          # A delivery UUID is the receipt. Its presence is the thing that
          # distinguishes an accepted upload from a quiet no-op.
          UUID=$(python3 -c "
          import json,sys
          try:
              d=json.load(open('$RUNNER_TEMP/upload.json'))
          except Exception:
              sys.exit(0)
          print(d.get('success-message','') or (d.get('product-errors') and 'ERRORS') or '')
          " 2>/dev/null || true)
          echo "altool summary: ${UUID:-（none returned）}"

          if grep -qi 'product-errors' "$RUNNER_TEMP/upload.json"; then
            echo "APPLE REPORTED PRODUCT ERRORS — the upload did NOT succeed."
            exit 1
          fi
          echo "no product-errors in Apple's response"

      - name: Remove the API key
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 || true
          rmdir "$HOME/.appstoreconnect/private_keys" 2>/dev/null || true

      # NOT SUBMITTED FOR REVIEW. A build reaching TestFlight and an app being
      # submitted to the App Store are different things, and only the first
      # happens here. Nothing in this job touches the listing, the
      # screenshots, or the review queue.
