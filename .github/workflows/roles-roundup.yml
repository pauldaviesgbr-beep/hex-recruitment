name: Roles roundup email

# Weekly "roles for you this week" email to candidates.
#
# WHY A GITHUB ACTION RATHER THAN A VERCEL CRON
# Vercel triggers cron jobs with an HTTP GET, and this route's GET handler is
# deliberately status-only — it never sends, so that no stray browser request or
# crawler can mail fifteen people. A Vercel cron pointed at it would return a
# tidy 200 with sent: 0 every Tuesday and quietly deliver nothing.
#
# Rather than remove that safety rail, the trigger moved here. It also buys the
# observability we found we were missing: Actions keeps a visible run history
# and emails on failure, where a Vercel cron returning 200 over a failed send
# told nobody anything.
#
# Same mechanism as the Goldenkeys import, deliberately: scrape at 06:00 and
# roundup at 08:00 on the same Tuesday is now one pairing on one system, not two
# schedules that happen to line up.
#
# Requires repo secrets: SITE_URL, CRON_SECRET

on:
  # ARMED 29 Jul 2026, after a manual send was watched end to end.
  #
  # Two hours after the Goldenkeys scrape (0 6 * * 2) so the email goes out
  # against a board refreshed that morning. If either time moves, move both —
  # the pairing is the point, not the individual times.
  schedule:
    - cron: '0 8 * * 2'   # Tuesdays 08:00 UTC (09:00 UK in summer)

  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (no email), test (one address), send (all recipients)'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, test, send]
      testTo:
        description: 'Address for test mode. Ignored otherwise.'
        type: string
        required: false
        default: 'pauldavies.gbr@gmail.com'
      confirm:
        description: 'Type SEND to confirm a real send to every recipient. Required for mode=send.'
        type: string
        required: false
        default: ''

concurrency:
  group: roles-roundup
  cancel-in-progress: false

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # THE REPO AND NODE COME FIRST, AND THE ORDER IS LOAD-BEARING.
      #
      # ADDED 16 Sept 2026. There was no checkout step, so the delivery check's
      # `node scripts/check-roundup-delivery.mjs` ran against a bare runner that
      # had never held this repository: MODULE_NOT_FOUND, and `set -euo pipefail`
      # turned that into a red run. Seven consecutive red scheduled runs — and
      # the check itself HAS NEVER ONCE EXECUTED. Both the step and the script
      # arrived in 3c8a9c7 on 29 Jul 2026; the only two green runs were the day
      # before, on 28 July.
      #
      # These sit ABOVE the trigger so a checkout or node failure happens while
      # nothing has been emailed yet. Below it, the same failure would leave real
      # candidates mailed and the run red for a reason unconnected to the send.
      #
      # No `npm install`, deliberately, and no `cache: npm` with it — unlike the
      # Goldenkeys importer this script imports nothing but `node:fs`. Installing
      # would add a minute to buy nothing, and a cache with no install to feed is
      # ceremony.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ONE STEP, ONE RESOLUTION, ONE READ.
      #
      # The confirmation used to live in a separate step whose `if:` read
      # `inputs.confirm` directly, while the request body read a CONFIRM env var
      # built from `${{ github.event_name == 'schedule' && 'SEND' || inputs.confirm }}`.
      # On run #4 the guard step SKIPPED — so it saw confirm=SEND — and the POST
      # still arrived without it, and the route rightly refused. Two reads of the
      # same intention that could disagree, and did.
      #
      # I could not reproduce which of the two was wrong by reading the file, so
      # rather than guess I removed the difference: the inputs are passed in raw,
      # resolved ONCE in shell, and the same two variables are used by both the
      # refusal check and the payload. There is no longer a second value to be
      # out of step with the first.
      - name: Trigger the roundup
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Raw inputs only — no expression logic in YAML. On a schedule these
          # arrive empty, which is correct and handled below: workflow_dispatch
          # defaults are applied by GitHub only for a workflow_dispatch event, so
          # `inputs.mode` on a schedule is '' and NOT 'dry-run'.
          EVENT_NAME: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_TEST_TO: ${{ inputs.testTo }}
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SITE_URL and CRON_SECRET repo secrets must both be set."
            exit 1
          fi

          # A schedule carries no inputs, so it decides for itself: a real send,
          # with the confirmation the route requires. Anything manual uses what
          # was typed, defaulting to dry-run.
          #
          # This does mean the confirmation token stops protecting the SCHEDULED
          # path. What protects it instead — CORRECTED 4 Aug 2026, and read this
          # list rather than the one it replaces:
          #   1. CRON_SECRET is required to reach the send path at all
          #   2. isDue() gives each candidate a 7-day cadence (lib/rolesRoundup.ts,
          #      CADENCE_DAYS minus CADENCE_SLACK_DAYS = 6.0 days), so even a
          #      schedule misconfigured to fire hourly cannot mail anyone twice
          #      in a week — and a manual dispatch followed by a late scheduled
          #      run cannot double-send, because markSent() stamps each recipient
          #      as it goes and the second run finds nobody due
          #   3. the manual path still needs BOTH keys
          #
          # WHAT USED TO BE ITEM 1 AND IS NO LONGER TRUE: "the schedule block
          # above is COMMENTED OUT — enabling it is a deliberate act by a person
          # editing this file". It was armed on 29 Jul 2026 and this list was not
          # updated, so for six days the file named a rail that did not exist, on
          # the one path that emails real candidates. A stale comment is worse
          # than no comment: the next person reading at speed counts it.
          #
          # If the schedule is ever disarmed again, fix this list in the same
          # commit.
          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE="send"
            CONFIRM="SEND"
          else
            MODE="${IN_MODE:-dry-run}"
            CONFIRM="${IN_CONFIRM:-}"
          fi

          # Say what we hold BEFORE acting on it. Debugging the last failure blind
          # cost a run; the confirmation is reported as present/absent rather than
          # echoed, since it is a shared token.
          if [ "$CONFIRM" = "SEND" ]; then confirm_state="present and correct"; else confirm_state="absent or wrong"; fi
          echo "event=${EVENT_NAME}  resolved mode=${MODE}  confirm: ${confirm_state}"

          # The refusal now reads the SAME variable the payload will use.
          if [ "$MODE" = "send" ] && [ "$CONFIRM" != "SEND" ]; then
            echo "::error::mode=send requires confirm=SEND. Refusing to mail real candidates."
            exit 1
          fi

          # Fail on an unresolved mode rather than falling through to something
          # harmless-looking. An empty MODE used to become {"mode": ""}, which
          # the route reads as dry-run — a green run that sends nothing.
          case "$MODE" in
            dry-run) payload='{"mode":"dry-run"}' ;;
            test)    payload="{\"mode\":\"test\",\"testTo\":\"${IN_TEST_TO}\"}" ;;
            send)    payload="{\"mode\":\"send\",\"confirm\":\"${CONFIRM}\"}" ;;
            *)
              echo "::error::MODE resolved to '${MODE}', which is not dry-run, test or send. Refusing to guess."
              exit 1
              ;;
          esac

          # Prove the body carries what we think, without printing the token.
          echo "payload keys: $(echo "$payload" | tr -d '{}\"' | tr ',' '\n' | cut -d: -f1 | tr '\n' ' ')"
          echo "POST ${SITE_URL}/api/cron/roles-roundup"

          # -o/-w rather than --fail: we want the BODY on a failure, because the
          # route returns the per-recipient failed[] list alongside the 500.
          status=$(curl -sS -X POST "${SITE_URL}/api/cron/roles-roundup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "$payload" \
            -o response.json -w '%{http_code}')

          echo "HTTP ${status}"
          python3 -m json.tool response.json || cat response.json

          # A failed send must fail the RUN. This is the whole point of moving
          # the trigger here: the route now returns 500 when any send fails, and
          # Actions turns that into a red run and a notification email. A green
          # tick must mean the emails actually went.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Roundup returned HTTP ${status} — see the response body above."
            exit 1
          fi

          sent=$(python3 -c "import json;print(json.load(open('response.json')).get('sent',0))")
          echo "::notice::Roundup ${MODE} completed — sent=${sent}"
          echo "SENT_COUNT=${sent}" >> "$GITHUB_ENV"
          echo "RESOLVED_MODE=${MODE}" >> "$GITHUB_ENV"

      # "sent" counts what Resend ACCEPTED, not what arrived. Two candidates
      # asked why they hadn't received an email that the run had reported as
      # sent, and answering it meant interrogating Resend by hand. This does
      # that automatically, in the log you are already looking at.
      - name: Check what was actually delivered
        if: env.RESOLVED_MODE == 'send' && env.SENT_COUNT != '0'
        env:
          # TWO CAPABILITIES THAT HAVE BEEN WEARING ONE NAME.
          #
          # The key the PRODUCT uses is send-only, and a send-only key answers
          # GET /emails with HTTP 401 "restricted_api_key" and no data[] —
          # measured against the real key on 16 Sept 2026. If the repo secret holds it
          # this step now goes red and says exactly what to do about it, which is
          # the intended behaviour rather than a regression: set
          # RESEND_READ_API_KEY to a key with read access and it goes green.
          RESEND_READ_API_KEY: ${{ secrets.RESEND_READ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail

          # A MISSING KEY IS BLINDNESS, AND BLINDNESS IS NOW RED.
          # This used to warn and exit 0 — so the one condition guaranteeing the
          # check could tell us nothing was also the one it reported as fine.
          # News about one bounced address failed the run; news about the
          # instrument passed it. That is now the other way round.
          if [ -n "${RESEND_READ_API_KEY:-}" ]; then
            KEY="$RESEND_READ_API_KEY"; KEY_NAME="RESEND_READ_API_KEY"
          elif [ -n "${RESEND_API_KEY:-}" ]; then
            KEY="$RESEND_API_KEY"; KEY_NAME="RESEND_API_KEY"
          else
            echo "::error::Neither RESEND_READ_API_KEY nor RESEND_API_KEY is set — the delivery check cannot see Resend."
            echo "The roundup itself may well have gone out; nothing here can confirm it either way."
            exit 1
          fi
          echo "delivery check reading Resend with: ${KEY_NAME}"

          # Delivery status is asynchronous: Resend reports 'sent' the moment it
          # accepts a message and only becomes 'delivered' once the receiving
          # server has taken it, which is usually seconds but not always. Give it
          # a moment, then report what we have — WITHOUT failing the run for a
          # status that simply hasn't settled. An unsettled status is not a
          # failure, and treating it as one would make this step cry wolf.
          sleep 45

          # curl EXITS 0 ON AN HTTP 400 — it fetched a page, and the page was an
          # error. `set -e` cannot see that, so the status is read rather than
          # assumed. The body is kept either way: the script has its own refusal
          # for an error payload, so these are two independent guards on the same
          # question rather than one guard restated.
          http=$(curl -sS "https://api.resend.com/emails?limit=100" \
            -H "Authorization: Bearer ${KEY}" -o emails.json -w '%{http_code}')
          echo "GET /emails -> HTTP ${http}"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "::error::Resend answered HTTP ${http} to the delivery check — it cannot see the messages."
            cat emails.json
            echo
            echo "A send-only key answers exactly this way. Set RESEND_READ_API_KEY to a key with read access."
            exit 1
          fi

          # Node rather than python here: it is what the rest of this repo is
          # written in, it is preinstalled on the runner, and — the reason that
          # actually decided it — I can run this exact script locally against
          # the real API before shipping it, which I could not do with python.
          node scripts/check-roundup-delivery.mjs emails.json "$SENT_COUNT"
